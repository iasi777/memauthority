name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.5'
          cache-dependency-path: go.sum
      - name: Verify modules
        run: go mod verify
      - name: Check documentation and runnable example
        if: runner.os == 'Linux'
        shell: bash
        run: bash tools/check-docs.sh
      - name: Test
        run: go test ./...
      - name: Vet
        run: go vet ./...
      - name: Build CLI
        run: go build -trimpath -buildvcs=false -o ${{ runner.temp }}/v-memory${{ runner.os == 'Windows' && '.exe' || '' }} ./cmd/v-memory
      - name: Build linux/arm64 production target
        if: runner.os == 'Linux'
        shell: bash
        run: CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -trimpath -buildvcs=false -o /tmp/v-memory-linux-arm64 ./cmd/v-memory
